<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我们的回忆 · 手势魔法相册</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw; height: 100vh; height: 100dvh; overflow: hidden;
  background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
  font-family: 'Georgia', 'STSong', 'SimSun', 'Noto Serif SC', serif;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ── Canvases ── */
#starfield { position: fixed; inset: 0; z-index: 0; }
#hearts   { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
#fireworks { position: fixed; inset: 0; z-index: 10; pointer-events: none; }

/* ── Landing overlay ── */
#landing {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, #0d1b2a 0%, #020508 100%);
  transition: opacity 0.8s ease, visibility 0.8s ease;
  gap: 0;
}
#landing.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
#landing .moon {
  width: 130px; height: 130px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff9c4 0%, #fdd835 30%, #f9a825 70%, transparent 72%);
  box-shadow: 0 0 80px 30px rgba(255,235,150,0.25), 0 0 160px 60px rgba(255,215,0,0.12);
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
#landing h1 {
  margin-top: 36px;
  font-size: clamp(1.4rem, 5vw, 2.2rem); color: #fce4ec; font-weight: normal;
  letter-spacing: 0.15em; text-shadow: 0 0 30px rgba(255,183,197,0.5);
}
#landing .subtitle {
  margin-top: 12px; font-size: clamp(0.8rem, 3vw, 1rem);
  color: rgba(255,255,255,0.50); letter-spacing: 0.08em;
  text-align: center; padding: 0 24px;
}
#landing .btn-start {
  margin-top: 48px;
  padding: 16px 48px; font-size: 1.1rem;
  color: #fff; letter-spacing: 0.12em;
  background: linear-gradient(135deg, rgba(255,107,157,0.5) 0%, rgba(255,64,129,0.4) 100%);
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 50px; cursor: pointer;
  box-shadow: 0 0 40px rgba(255,107,157,0.3), 0 0 80px rgba(255,64,129,0.15);
  transition: all 0.35s ease;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
#landing .btn-start:active {
  transform: scale(0.94);
  box-shadow: 0 0 60px rgba(255,107,157,0.5), 0 0 120px rgba(255,64,129,0.25);
}

/* ── Main container ── */
#main {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center;
  width: 100%; max-width: 560px; padding: 20px;
  opacity: 0; transform: translateY(20px);
  transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
}
#main.visible { opacity: 1; transform: translateY(0); }

/* ── Photo frame (glassmorphism) ── */
#photo-frame {
  position: relative;
  width: min(88vw, 520px);
  aspect-ratio: 3/4;
  border-radius: 20px; overflow: hidden;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 8px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06) inset, 0 0 80px rgba(180,160,200,0.08);
  transition: box-shadow 0.6s ease;
}
#photo-inner {
  position: relative; width: 100%; height: 100%; overflow: hidden;
}
.photo-slide {
  position: absolute; inset: 0;
  transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1);
}
.photo-slide img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.photo-slide.cur  { transform: translateX(0); opacity: 1; }
.photo-slide.exit-left  { transform: translateX(-105%); opacity: 0; }
.photo-slide.exit-right { transform: translateX(105%); opacity: 0; }
.photo-slide.enter-from-left  { transform: translateX(-105%); opacity: 0; }
.photo-slide.enter-from-right { transform: translateX(105%); opacity: 0; }

/* ── Caption ── */
#caption {
  margin-top: 24px; font-size: clamp(0.95rem, 3.5vw, 1.2rem);
  color: rgba(255,255,255,0.7); letter-spacing: 0.08em; text-align: center;
  min-height: 2.2em; transition: opacity 0.4s ease;
  text-shadow: 0 0 12px rgba(255,200,210,0.3);
  padding: 0 12px;
}

/* ── Touch hint zones ── */
.touch-zone {
  position: fixed; top: 0; bottom: 0; z-index: 5;
  width: 38%; pointer-events: none;
}
.touch-zone.active { pointer-events: auto; }
.touch-zone-left  { left: 0; }
.touch-zone-right { right: 0; }
.touch-flash {
  position: fixed; top: 50%; z-index: 6; pointer-events: none;
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(255,255,255,0.12);
  transform: translate(-50%, -50%) scale(0);
  opacity: 0; transition: none;
}
.touch-flash.pop {
  opacity: 1; transform: translate(-50%, -50%) scale(1);
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.touch-flash.pop.done {
  opacity: 0; transform: translate(-50%, -50%) scale(2.5);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

/* ── Direction indicators ── */
#indicator-next, #indicator-prev {
  position: fixed; top: 50%; transform: translateY(-50%);
  z-index: 8; pointer-events: none;
  font-size: clamp(1.2rem, 4vw, 2.2rem); color: rgba(255,255,255,0.85);
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 14px 20px; border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.12);
  opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
}
#indicator-next { right: 4%; }
#indicator-prev { left: 4%; }
#indicator-next.show {
  opacity: 1; transform: translateY(-50%) translateX(6px);
  animation: bounce-right 0.7s ease;
}
#indicator-prev.show {
  opacity: 1; transform: translateY(-50%) translateX(-6px);
  animation: bounce-left 0.7s ease;
}
@keyframes bounce-right {
  0%, 100% { transform: translateY(-50%) translateX(0); }
  50% { transform: translateY(-50%) translateX(14px); }
}
@keyframes bounce-left {
  0%, 100% { transform: translateY(-50%) translateX(0); }
  50% { transform: translateY(-50%) translateX(-14px); }
}

/* ── Camera preview ── */
#cam-container {
  position: fixed; bottom: 20px; right: 16px; z-index: 9;
  width: 90px; height: 68px; border-radius: 12px; overflow: hidden;
  border: 1.5px solid rgba(255,255,255,0.18);
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  opacity: 0; transform: scale(0.85);
  transition: opacity 0.6s ease, transform 0.6s ease;
  background: rgba(0,0,0,0.3);
}
#cam-container.visible { opacity: 1; transform: scale(1); }
#cam-preview {
  width: 100%; height: 100%; object-fit: cover;
  transform: scaleX(-1);
}
#cam-label {
  position: absolute; bottom: 2px; left: 6px;
  font-size: 0.5rem; color: rgba(255,255,255,0.5);
  letter-spacing: 0.04em;
}

/* ── Status bar ── */
#status-bar {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  z-index: 9; pointer-events: none; white-space: nowrap;
  font-size: clamp(0.7rem, 2.5vw, 0.85rem); color: rgba(255,255,255,0.7);
  background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
  padding: 8px 18px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: all 0.4s ease;
}
#status-bar.detected { color: #a5d6a7; border-color: rgba(165,214,167,0.3); }
#status-bar.swiped { color: #ffcc80; border-color: rgba(255,204,128,0.3); }
#status-bar.hint { color: #ffcc80; border-color: rgba(255,204,128,0.25); }

@media (min-width: 768px) {
  #photo-frame { aspect-ratio: 4/3; }
  #cam-container { width: 120px; height: 90px; bottom: 24px; right: 24px; }
  .touch-zone { width: 30%; }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<canvas id="hearts"></canvas>
<canvas id="fireworks"></canvas>

<!-- Landing page -->
<div id="landing">
  <div class="moon"></div>
  <h1>我们的回忆</h1>
  <p class="subtitle">距离不是问题，因为心在一起</p>
  <button class="btn-start">开启我们的回忆</button>
</div>

<!-- Main content -->
<div id="main">
  <div id="photo-frame">
    <div id="photo-inner"></div>
  </div>
  <p id="caption"></p>
</div>

<!-- Touch zones (fallback nav) -->
<div class="touch-zone touch-zone-left" id="touch-left"></div>
<div class="touch-zone touch-zone-right" id="touch-right"></div>
<div class="touch-flash" id="flash-left" style="left:25%"></div>
<div class="touch-flash" id="flash-right" style="left:75%"></div>

<!-- Direction indicators -->
<div id="indicator-next">Next →</div>
<div id="indicator-prev">← Prev</div>

<!-- Camera preview -->
<div id="cam-container">
  <video id="cam-preview" autoplay playsinline></video>
  <span id="cam-label">摄像头</span>
</div>

<!-- Status indicator -->
<div id="status-bar">✨ 点击下方按钮开始</div>

<!-- BGM -->
<audio id="bgm" loop preload="auto">
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<!-- MediaPipe CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

<script>
/* ================================================================
   Photo data
   ================================================================ */
var PHOTOS = [
  { src: '1.jpg', caption: '我们的第一张合照，幸福从此开始 💕' },
  { src: 'https://picsum.photos/seed/memory2/600/450', caption: '和你在一起的每一刻都是礼物 💝' },
  { src: 'https://picsum.photos/seed/memory3/600/450', caption: '你笑起来的样子，是我见过最美的风景 🌸' },
  { src: 'https://picsum.photos/seed/memory4/600/450', caption: '牵着你的手，走到时间的尽头 💫' },
  { src: 'https://picsum.photos/seed/memory5/600/450', caption: '月亮和星星都知道，我最喜欢你 🌙' },
  { src: 'https://picsum.photos/seed/memory6/600/450', caption: '你是我的今天，也是我的每一个明天 💖' },
];

/* ================================================================
   State
   ================================================================ */
var state = {
  idx: 0, isTransitioning: false,
  swipeCooldown: false, heartCooldown: false,
  cameraReady: false, bgmPlaying: false,
  gestureEverDetected: false,
};

/* ================================================================
   DOM refs
   ================================================================ */
var $ = function (sel) { return document.querySelector(sel); };

var landing    = $('#landing');
var main       = $('#main');
var photoInner = $('#photo-inner');
var caption    = $('#caption');
var indNext    = $('#indicator-next');
var indPrev    = $('#indicator-prev');
var camPreview = $('#cam-preview');
var camCont    = $('#cam-container');
var bgm        = $('#bgm');
var statusBar  = $('#status-bar');
var fwCanvas   = $('#fireworks');
var fwCtx      = fwCanvas.getContext('2d');
var sfCanvas   = $('#starfield');
var sfCtx      = sfCanvas.getContext('2d');
var htCanvas   = $('#hearts');
var htCtx      = htCanvas.getContext('2d');
var touchL     = $('#touch-left');
var touchR     = $('#touch-right');
var flashL     = $('#flash-left');
var flashR     = $('#flash-right');
var btnStart   = $('.btn-start');

/* ================================================================
   Starfield
   ================================================================ */
var STARS = [];
var NUM_STARS = 160;

function initStars(W, H) {
  STARS.length = 0;
  for (var i = 0; i < NUM_STARS; i++) {
    STARS.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.8 + 0.4,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.015 + 0.005,
      baseAlpha: Math.random() * 0.45 + 0.35,
    });
  }
}

function resizeStarfield() {
  sfCanvas.width = window.innerWidth;
  sfCanvas.height = window.innerHeight;
  initStars(sfCanvas.width, sfCanvas.height);
}

function drawStars(now) {
  var W = sfCanvas.width, H = sfCanvas.height;
  sfCtx.clearRect(0, 0, W, H);
  for (var i = 0; i < STARS.length; i++) {
    var s = STARS[i];
    var a = Math.max(0.08, Math.min(1, s.baseAlpha + Math.sin(now * s.speed + s.phase) * 0.3));
    sfCtx.beginPath();
    sfCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    sfCtx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
    sfCtx.fill();
    if (s.r > 1.0 && a > 0.55) {
      sfCtx.beginPath();
      sfCtx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
      sfCtx.fillStyle = 'rgba(255,240,255,' + (a * 0.08).toFixed(3) + ')';
      sfCtx.fill();
    }
  }
}

/* ================================================================
   Floating hearts
   ================================================================ */
var floatingHearts = [];

function resizeHearts() {
  htCanvas.width = window.innerWidth;
  htCanvas.height = window.innerHeight;
}

function spawnFloatingHeart() {
  var W = htCanvas.width, H = htCanvas.height;
  floatingHearts.push({
    x: Math.random() * W,
    y: H + 30,
    size: 14 + Math.random() * 26,
    speed: 0.3 + Math.random() * 0.7,
    wobbleAmp: 0.3 + Math.random() * 0.6,
    wobbleSpeed: 0.01 + Math.random() * 0.03,
    wobblePhase: Math.random() * Math.PI * 2,
    opacity: 0.15 + Math.random() * 0.25,
    life: 1,
    decay: 0.0015 + Math.random() * 0.003,
  });
}

function drawHeart(ctx, cx, cy, size, alpha) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(size / 16, size / 16);
  ctx.beginPath();
  ctx.moveTo(0, 5);
  for (var t = 0; t < Math.PI * 2; t += 0.05) {
    var sx = 16 * Math.pow(Math.sin(t), 3);
    var sy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    ctx.lineTo(sx, sy);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,140,170,' + alpha.toFixed(2) + ')';
  ctx.fill();
  ctx.restore();
}

function updateHearts(now) {
  var W = htCanvas.width, H = htCanvas.height;
  htCtx.clearRect(0, 0, W, H);
  for (var i = floatingHearts.length - 1; i >= 0; i--) {
    var h = floatingHearts[i];
    h.y -= h.speed;
    h.x += Math.sin(now * h.wobbleSpeed + h.wobblePhase) * h.wobbleAmp;
    h.life -= h.decay;
    if (h.life <= 0 || h.y < -60) { floatingHearts.splice(i, 1); continue; }
    drawHeart(htCtx, h.x, h.y, h.size, h.opacity * h.life);
  }
  // Spawn new hearts periodically
  if (floatingHearts.length < 35 && Math.random() < 0.05) {
    spawnFloatingHeart();
  }
}

/* ================================================================
   Fireworks particle system
   ================================================================ */
var particles = [];

function resizeFireworks() {
  fwCanvas.width = window.innerWidth;
  fwCanvas.height = window.innerHeight;
}

function heartCurve(t) {
  var sx = 16 * Math.pow(Math.sin(t), 3);
  var sy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
  return { x: sx, y: sy };
}

function spawnFireworks(cx, cy) {
  var colors = [
    '#ff6b9d','#ff4081','#f48fb1','#ff80ab',
    '#ffb6c1','#ffd1dc','#ffc1cc','#fff0f5',
    '#ffb3ba','#ff8a80','#ff5252','#ffab91',
    '#ffe0e6','#ff9aa2','#ffdae0','#f8bbd0',
  ];
  var count = 120;
  for (var i = 0; i < count; i++) {
    var t = (i / count) * Math.PI * 2;
    var heart = heartCurve(t);
    var scale = 4 + Math.random() * 3;
    var angle = Math.random() * Math.PI * 2;
    var speed = 1 + Math.random() * 3;
    particles.push({
      x: cx, y: cy,
      vx: heart.x * scale * (0.8 + Math.random() * 0.4) + Math.cos(angle) * speed,
      vy: heart.y * scale * (0.8 + Math.random() * 0.4) + Math.sin(angle) * speed - 1.5,
      life: 1, decay: 0.006 + Math.random() * 0.018,
      size: 1.4 + Math.random() * 2.6,
      color: colors[Math.floor(Math.random() * colors.length)],
      gravity: 0.04 + Math.random() * 0.04,
    });
  }
}

function triggerHeartFireworks() {
  var W = fwCanvas.width, H = fwCanvas.height;
  var bursts = [
    { cx: W * 0.35, cy: H * 0.35, delay: 0 },
    { cx: W * 0.65, cy: H * 0.35, delay: 160 },
    { cx: W * 0.5,  cy: H * 0.52, delay: 320 },
    { cx: W * 0.3,  cy: H * 0.52, delay: 440 },
    { cx: W * 0.7,  cy: H * 0.52, delay: 560 },
  ];
  for (var b = 0; b < bursts.length; b++) {
    (function (burst) {
      setTimeout(function () { spawnFireworks(burst.cx, burst.cy); }, burst.delay);
    })(bursts[b]);
  }
}

function updateFireworks() {
  fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += p.gravity;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    fwCtx.beginPath();
    fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    if (p.color.charAt(0) === '#') {
      var r = parseInt(p.color.slice(1,3), 16);
      var g = parseInt(p.color.slice(3,5), 16);
      var b = parseInt(p.color.slice(5,7), 16);
      fwCtx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + p.life.toFixed(2) + ')';
    } else {
      fwCtx.fillStyle = p.color;
    }
    fwCtx.fill();
  }
}

/* ================================================================
   Photo rendering
   ================================================================ */
function createSlide(idx, cls) {
  var div = document.createElement('div');
  div.className = 'photo-slide ' + cls;
  div.dataset.idx = idx;
  var img = document.createElement('img');
  img.src = PHOTOS[idx].src;
  img.alt = 'Photo ' + (idx + 1);
  img.draggable = false;
  div.appendChild(img);
  return div;
}

function buildSlides(curIdx) {
  photoInner.innerHTML = '';
  var total = PHOTOS.length;
  photoInner.appendChild(createSlide((curIdx - 1 + total) % total, 'exit-left'));
  photoInner.appendChild(createSlide(curIdx, 'cur'));
  photoInner.appendChild(createSlide((curIdx + 1) % total, 'exit-right'));
}

function setInitialSlides() {
  buildSlides(state.idx);
  caption.textContent = PHOTOS[state.idx].caption;
}

function transitionTo(newIdx, dir) {
  if (state.isTransitioning) return;
  state.isTransitioning = true;
  var total = PHOTOS.length;
  newIdx = ((newIdx % total) + total) % total;
  if (newIdx === state.idx) { state.isTransitioning = false; return; }

  var oldSlides = photoInner.querySelectorAll('.photo-slide');
  var exitCls = dir > 0 ? 'exit-left' : 'exit-right';
  for (var s = 0; s < oldSlides.length; s++) {
    oldSlides[s].className = 'photo-slide ' + exitCls;
  }

  var enterCls = dir > 0 ? 'enter-from-right' : 'enter-from-left';
  var newDiv = createSlide(newIdx, enterCls);
  photoInner.appendChild(newDiv);

  void newDiv.offsetWidth;
  newDiv.className = 'photo-slide cur';

  caption.style.opacity = '0';
  setTimeout(function () {
    caption.textContent = PHOTOS[newIdx].caption;
    caption.style.opacity = '1';
  }, 200);

  state.idx = newIdx;

  setTimeout(function () {
    buildSlides(state.idx);
    state.isTransitioning = false;
  }, 580);
}

/* ================================================================
   Touch fallback — tap left/right to navigate
   ================================================================ */
function enableTouchZones() {
  touchL.classList.add('active');
  touchR.classList.add('active');
}

function flashZone(side) {
  var el = side === 'left' ? flashL : flashR;
  el.classList.remove('done');
  el.classList.add('pop');
  setTimeout(function () { el.classList.add('done'); }, 100);
}

touchL.addEventListener('click', function (e) {
  e.stopPropagation();
  if (state.isTransitioning || state.swipeCooldown) return;
  state.swipeCooldown = true;
  flashZone('left');
  showIndicator('prev');
  transitionTo(state.idx - 1, -1);
  setTimeout(function () { state.swipeCooldown = false; }, 1200);
});

touchR.addEventListener('click', function (e) {
  e.stopPropagation();
  if (state.isTransitioning || state.swipeCooldown) return;
  state.swipeCooldown = true;
  flashZone('right');
  showIndicator('next');
  transitionTo(state.idx + 1, 1);
  setTimeout(function () { state.swipeCooldown = false; }, 1200);
});

/* ================================================================
   Direction indicators
   ================================================================ */
var indicatorTimer = null;
function showIndicator(dir) {
  var el = dir === 'next' ? indNext : indPrev;
  el.classList.add('show');
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
  if (indicatorTimer) clearTimeout(indicatorTimer);
  indicatorTimer = setTimeout(function () { el.classList.remove('show'); }, 900);
}

/* ================================================================
   Gesture detection (cumulative displacement)
   ================================================================ */
var SWIPE_DISPLACEMENT = 0.18;
var SWIPE_COOLDOWN_MS = 1200;
var DIR_RESET_MS = 400;

var HEART_FINGER_DIST = 0.08;
var HEART_WRIST_DIST = 0.35;
var HEART_COOLDOWN_MS = 3500;

var lastHandCount = 0;
var lastX = null;
var cumulativeX = 0;
var lastMoveTime = 0;
var swipeDir = 0;
var mediaPipeTimeout = null;

function onHandResults(results) {
  if (!state.cameraReady) return;

  var hands = results.multiHandLandmarks;
  var handCount = hands ? hands.length : 0;

  // Clear MediaPipe loading timeout on first detection
  if (handCount > 0 && !state.gestureEverDetected) {
    state.gestureEverDetected = true;
    if (mediaPipeTimeout) { clearTimeout(mediaPipeTimeout); mediaPipeTimeout = null; }
  }

  // ── Update status bar ──
  if (handCount !== lastHandCount) {
    lastHandCount = handCount;
    statusBar.classList.remove('swiped', 'hint');
    if (handCount === 0) {
      statusBar.textContent = '📷 等待手势... 或点击屏幕左右切换';
      statusBar.classList.remove('detected');
      lastX = null; cumulativeX = 0; swipeDir = 0;
    } else if (handCount === 1) {
      statusBar.textContent = '👋 单手模式 — 挥动切换照片';
      statusBar.classList.add('detected');
    } else {
      statusBar.textContent = '🙌 双手模式 — 比爱心放烟花';
      statusBar.classList.add('detected');
    }
  }

  // ── Swipe detection ──
  if (hands && hands.length > 0 && !state.swipeCooldown && !state.isTransitioning) {
    var wrist = hands[0][0];
    var x = 1 - wrist.x;
    var now = performance.now();

    if (lastX !== null) {
      var dx = x - lastX;

      if (now - lastMoveTime > DIR_RESET_MS) {
        cumulativeX = 0; swipeDir = 0;
      }

      if (dx > 0.001) {
        if (swipeDir <= 0) { cumulativeX = dx; swipeDir = 1; }
        else { cumulativeX += dx; }
        lastMoveTime = now;
      } else if (dx < -0.001) {
        if (swipeDir >= 0) { cumulativeX = dx; swipeDir = -1; }
        else { cumulativeX += dx; }
        lastMoveTime = now;
      }

      var progress = Math.min(1, Math.abs(cumulativeX) / SWIPE_DISPLACEMENT);
      if (progress > 0.05 && handCount === 1) {
        var arrow = swipeDir > 0 ? '→' : '←';
        var fill = Math.floor(progress * 10);
        var bar = '';
        for (var ii = 0; ii < 10; ii++) { bar += ii < fill ? '█' : '░'; }
        statusBar.textContent = arrow + ' ' + bar + ' ' + Math.floor(progress * 100) + '%';
        statusBar.classList.add('detected');
      }

      if (Math.abs(cumulativeX) > SWIPE_DISPLACEMENT) {
        var dir = cumulativeX > 0 ? 1 : -1;
        state.swipeCooldown = true;
        cumulativeX = 0; swipeDir = 0; lastX = null;
        statusBar.textContent = dir > 0 ? '→ 下一张' : '← 上一张';
        statusBar.classList.add('swiped');
        if (dir > 0) { showIndicator('next'); transitionTo(state.idx + 1, 1); }
        else { showIndicator('prev'); transitionTo(state.idx - 1, -1); }
        setTimeout(function () { state.swipeCooldown = false; }, SWIPE_COOLDOWN_MS);
      }
    } else {
      cumulativeX = 0; swipeDir = 0;
    }
    lastX = x;
  } else if (!hands || hands.length === 0) {
    lastX = null; cumulativeX = 0; swipeDir = 0;
  }

  // ── Heart gesture detection ──
  if (hands && hands.length >= 2 && !state.heartCooldown) {
    var h0 = hands[0], h1 = hands[1];
    var d04_0 = dist(h0[4], h0[8]);
    var d04_1 = dist(h1[4], h1[8]);
    var pinch0 = d04_0 < HEART_FINGER_DIST;
    var pinch1 = d04_1 < HEART_FINGER_DIST;
    var wristDist = dist(h0[0], h1[0]);
    if (pinch0 && pinch1 && wristDist < HEART_WRIST_DIST) {
      state.heartCooldown = true;
      triggerHeartFireworks();
      setTimeout(function () { state.heartCooldown = false; }, HEART_COOLDOWN_MS);
    }
  }
}

function dist(a, b) {
  var dx = a.x - b.x, dy = a.y - b.y, dz = (a.z || 0) - (b.z || 0);
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
}

/* ================================================================
   Camera & MediaPipe
   ================================================================ */
var handsInstance = null;

async function startCamera() {
  try {
    var stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' },
      audio: false,
    });
    camPreview.srcObject = stream;
    await camPreview.play();

    handsInstance = new Hands({
      locateFile: function (file) {
        return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + file;
      },
    });
    handsInstance.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.3,
    });
    handsInstance.onResults(onHandResults);

    var detecting = false;
    async function detectLoop() {
      if (!state.cameraReady) return;
      if (detecting) { requestAnimationFrame(detectLoop); return; }
      detecting = true;
      try { await handsInstance.send({ image: camPreview }); }
      catch (e) { /* skip frame errors */ }
      detecting = false;
      requestAnimationFrame(detectLoop);
    }

    state.cameraReady = true;
    camCont.classList.add('visible');
    statusBar.textContent = '📷 等待手势... 或点击屏幕左右切换';
    detectLoop();

    // Fallback: if MediaPipe doesn't detect hands within 10s, show touch hint
    mediaPipeTimeout = setTimeout(function () {
      if (!state.gestureEverDetected) {
        statusBar.textContent = '💡 手势加载较慢 — 试试点击屏幕左右切图';
        statusBar.classList.add('hint');
      }
    }, 10000);

  } catch (err) {
    console.warn('Camera error:', err);
    camCont.style.display = 'none';
    statusBar.textContent = '⚠️ 摄像头未授权 — 点击屏幕左右浏览照片';
    statusBar.classList.add('hint');
    enableTouchZones();
  }
}

/* ================================================================
   Landing page → start
   ================================================================ */
btnStart.addEventListener('click', async function (e) {
  e.stopPropagation();
  landing.classList.add('hidden');
  main.classList.add('visible');
  // Enable touch fallback immediately
  enableTouchZones();
  // Start BGM
  bgm.volume = 0.35;
  bgm.play().catch(function () { /* file may not exist */ });
  state.bgmPlaying = true;
  // Start camera + MediaPipe
  await startCamera();
});

/* ================================================================
   Animations loop
   ================================================================ */
function animate(ts) {
  drawStars(ts);
  updateHearts(ts);
  updateFireworks();
  requestAnimationFrame(animate);
}

/* ================================================================
   Init
   ================================================================ */
resizeStarfield();
resizeHearts();
resizeFireworks();
setInitialSlides();
// Seed some floating hearts for the landing page
for (var k = 0; k < 10; k++) { spawnFloatingHeart(); }
window.addEventListener('resize', function () {
  resizeStarfield();
  resizeHearts();
  resizeFireworks();
});
requestAnimationFrame(animate);
</script>
